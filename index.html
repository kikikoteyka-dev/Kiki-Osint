<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KikiHub</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Hanken+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --a:#5cd6ff;--a2:#8fe3ff;--bg:#04111a;--t1:#eef2f7;
  --t2:rgba(255,255,255,.55);--t3:rgba(255,255,255,.32);
  --g-bg:rgba(255,255,255,.03);--g-bd:rgba(255,255,255,.06);--g-bd2:rgba(255,255,255,.08);--g-bd-h:rgba(92,214,255,.28);
  --r:16px;--r2:10px;
  --ease-out:cubic-bezier(0.23,1,0.32,1);
}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--t1);font-family:'Hanken Grotesk',Arial,sans-serif}
select{accent-color:var(--a);color-scheme:dark}
.aurora-container{position:fixed;inset:0;z-index:0;pointer-events:none;width:100%;height:100%;opacity:.5;mix-blend-mode:screen;overflow:hidden}
.aurora-container canvas{display:block;width:100%;height:100%}
.bg-orbs{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bg-orbs span{position:absolute;border-radius:50%;animation:orbDrift ease-in-out infinite}
.bg-orbs span:nth-child(1){width:1200px;height:900px;background:radial-gradient(ellipse at 35% 40%,rgba(92,214,255,.16) 0%,rgba(5,20,35,.04) 60%,transparent 72%);filter:blur(60px);top:-25%;left:-20%;animation-duration:28s}
.bg-orbs span:nth-child(2){width:900px;height:800px;background:radial-gradient(ellipse at 50% 50%,rgba(92,214,255,.12) 0%,transparent 68%);filter:blur(80px);top:25%;right:-20%;animation-duration:36s;animation-delay:-12s}
.bg-orbs span:nth-child(3){width:700px;height:700px;background:radial-gradient(ellipse at 50% 50%,rgba(143,227,255,.10) 0%,transparent 70%);filter:blur(90px);bottom:-25%;left:30%;animation-duration:44s;animation-delay:-8s}
@keyframes orbDrift{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(55px,-40px) scale(1.06)}66%{transform:translate(-18px,52px) scale(.94)}}
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.025;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.82' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");background-size:256px 256px}
body::after{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;background-image:linear-gradient(rgba(92,214,255,.008) 1px,transparent 1px),linear-gradient(90deg,rgba(92,214,255,.008) 1px,transparent 1px);background-size:68px 68px}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes scanMove{0%{transform:translateY(-100vh)}100%{transform:translateY(100vh)}}
.scanline{position:fixed;left:0;width:100%;height:2px;z-index:200;pointer-events:none;background:linear-gradient(transparent,rgba(255,255,255,.04),transparent);animation:scanMove 7s linear infinite}

.panel{position:fixed;inset:0;z-index:1;display:flex;flex-direction:column;opacity:0;pointer-events:none;transform:scale(1.04) translateY(-8px);filter:blur(8px);transition:none;will-change:opacity,transform,filter}
.panel.active{opacity:1;pointer-events:all;transform:scale(1) translateY(0);filter:blur(0px);transition:opacity .45s cubic-bezier(.23,1,.32,1),transform .45s cubic-bezier(.23,1,.32,1),filter .3s cubic-bezier(.23,1,.32,1)}
.panel.leaving{opacity:0;pointer-events:none;transform:scale(.94) translateY(12px);filter:blur(6px);transition:opacity .28s cubic-bezier(.4,0,1,1),transform .28s cubic-bezier(.4,0,1,1),filter .2s ease}
#panel-osint,#panel-hc{overflow:hidden}
#panel-dl{align-items:center;justify-content:center;overflow:auto;padding:40px 20px 120px}
#panel-settings,#panel-geoint{display:block;overflow:auto;padding:40px 20px 120px}
#panel-settings .settings-card,#panel-geoint .tool-card{margin:0 auto}
.osint-frame{width:100%;height:100%;border:none}

/* Dock */
.icon-btns{position:fixed;bottom:28px;left:0;right:0;z-index:999;display:flex;gap:2em;align-items:center;justify-content:center;pointer-events:none;background:none;transition:transform .45s var(--ease-out),opacity .3s var(--ease-out)}
.icon-btns>.icon-btn,.icon-btns>.icon-btn-sep{pointer-events:auto}
.icon-btns *{pointer-events:auto}
.icon-btns.dock-hidden{transform:translateY(140%);opacity:0;pointer-events:none}

/* Dock toggle */
.dock-toggle{position:fixed;bottom:108px;left:50%;transform:translateX(-50%);z-index:1000;width:32px;height:20px;display:flex;align-items:center;justify-content:center;background:none;border:none;color:var(--a);opacity:.7;cursor:pointer;transition:bottom .45s var(--ease-out),opacity .2s,color .2s}
.dock-toggle:hover{opacity:.9;color:var(--a)}
.dock-toggle:active{transform:translateX(-50%) scale(.92)}
.dock-toggle svg{width:16px;height:16px;transition:transform .35s var(--ease-out)}
.dock-toggle.dock-hidden{bottom:14px}
.dock-toggle.dock-hidden svg{transform:rotate(180deg)}
.icon-btn{background-color:transparent;outline:none;position:relative;width:4.5em;height:4.5em;perspective:24em;transform-style:preserve-3d;-webkit-tap-highlight-color:transparent;border:none;cursor:pointer;transition:transform .15s cubic-bezier(.34,1.56,.64,1)}
.icon-btn:active{transform:scale(.88)}
.icon-btn__back,.icon-btn__front,.icon-btn__label{transition:opacity .3s cubic-bezier(.83,0,.17,1),transform .3s cubic-bezier(.83,0,.17,1)}
.icon-btn__back,.icon-btn__front{border-radius:1.25em;position:absolute;top:0;left:0;width:100%;height:100%}
.icon-btn__back{box-shadow:.5em -.5em .75em hsla(223,10%,10%,.15);display:block;transform:rotate(15deg);transform-origin:100% 100%;will-change:transform;background:linear-gradient(hsl(190,40%,34%),hsl(195,45%,18%))}
.icon-btn__front{background-color:hsla(0,0%,100%,.15);box-shadow:0 0 0 .1em hsla(0,0%,100%,.3) inset;backdrop-filter:blur(.75em);display:flex;align-items:center;justify-content:center;transform-origin:80% 50%;will-change:transform}
.icon-btn__icon{margin:auto;width:1.5em;height:1.5em;display:flex;align-items:center;justify-content:center;color:#fff;filter:drop-shadow(0 1px 2px rgba(0,0,0,.4))}
.icon-btn__icon svg{width:100%;height:100%}
.icon-btn__label{font-size:.75em;font-family:'JetBrains Mono',monospace;letter-spacing:.04em;white-space:nowrap;text-align:center;line-height:2;opacity:0;position:absolute;top:100%;left:50%;transform:translateX(-50%);color:rgba(255,255,255,.85);pointer-events:none}
.icon-btn:hover .icon-btn__back{transform:rotate(25deg) translate3d(-.5em,-.5em,.5em)}
.icon-btn:hover .icon-btn__front{transform:translate3d(0,0,2em)}
.icon-btn:hover .icon-btn__label{opacity:1;transform:translateX(-50%) translateY(4px)}
.icon-btn.is-active .icon-btn__back{transform:rotate(0deg)!important;background:linear-gradient(hsl(178,88%,44%),hsl(192,88%,34%))!important;box-shadow:0 0 22px hsla(178,88%,44%,.6),.5em -.5em .75em hsla(223,10%,10%,.15)}
.icon-btn.is-active::after{content:'';position:absolute;bottom:-12px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:rgba(255,255,255,.8);box-shadow:0 0 8px rgba(255,255,255,.5)}
.icon-btn-sep{width:1px;height:36px;align-self:center;flex-shrink:0;background:linear-gradient(180deg,transparent,rgba(255,255,255,.2) 30%,rgba(255,255,255,.2) 70%,transparent)}
.c-flipper .icon-btn__front{background-image:none}
.c-flipper .icon-btn__front::after{content:'';position:absolute;inset:-3%;background:url('/flipper_logo.png') center/contain no-repeat;filter:brightness(0) invert(1);opacity:.9;transform:translate(-4%,-4%)}

/* Settings */
.settings-card{background:var(--g-bg);border:1px solid var(--g-bd);border-radius:var(--r);padding:36px;width:460px;max-width:92vw;animation:fadeUp .4s cubic-bezier(.23,1,.32,1);position:relative;overflow:hidden}
.settings-card::before{
  content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:radial-gradient(280px circle at var(--mx,50%) var(--my,50%),rgba(92,214,255,.08),transparent 70%);
  opacity:0;transition:opacity .35s var(--ease-out);z-index:0;
}
.settings-card:hover::before{opacity:1}
.settings-card>*{position:relative;z-index:1}
.settings-title{font-family:'Bricolage Grotesque',Arial,sans-serif;font-size:20px;font-weight:600;letter-spacing:-.01em;color:#fff;margin-bottom:24px;display:flex;align-items:center;gap:10px}
.settings-title::before{content:'';width:14px;height:1px;background:rgba(92,214,255,.4)}
.setting-row{margin-bottom:14px}
.setting-label{font-size:10px;letter-spacing:.16em;text-transform:uppercase;font-family:'JetBrains Mono',monospace;color:rgba(92,214,255,.7);margin-bottom:8px}
.setting-inp{width:100%;background:var(--g-bg);border:1px solid var(--g-bd2);border-radius:var(--r2);padding:12px 14px;color:var(--t1);font-family:'JetBrains Mono',monospace;font-size:12px;outline:none;transition:border-color .2s ease,background .2s ease}
.setting-inp:focus{border-color:rgba(92,214,255,.35);background:rgba(92,214,255,.05)}
.setting-inp::placeholder{color:rgba(255,255,255,.2)}
.setting-inp option{background:var(--bg)}
select.setting-inp{cursor:pointer}
.ui-lang-switch{display:flex;gap:6px;background:var(--g-bg);border:1px solid var(--g-bd2);border-radius:var(--r2);padding:4px}
.ui-lang-btn{flex:1;padding:10px;border:none;border-radius:calc(var(--r2) - 4px);background:transparent;color:var(--t2);font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;transition:background .2s ease,color .2s ease,border-color .2s ease;border:1px solid transparent}
.ui-lang-btn:hover{color:#fff}
.ui-lang-btn.active{background:rgba(92,214,255,.12);color:var(--a);border-color:rgba(92,214,255,.2)}
.setting-btn{width:100%;padding:13px;border-radius:var(--r2);border:1px solid rgba(92,214,255,.18);font-family:'Bricolage Grotesque',Arial,sans-serif;font-size:14px;font-weight:600;cursor:pointer;background:rgba(92,214,255,.08);color:var(--a);margin-top:8px;transition:background .2s ease,border-color .2s ease,color .2s ease,transform .15s cubic-bezier(.23,1,.32,1)}
.setting-btn:hover{background:rgba(92,214,255,.14);border-color:rgba(92,214,255,.32);color:#fff}
.setting-btn:active{transform:scale(.98)}

/* Downloader & GEOINT */
.tool-card{background:var(--g-bg);border:1px solid var(--g-bd);border-radius:var(--r);padding:36px;width:520px;max-width:92vw;animation:fadeUp .4s cubic-bezier(.23,1,.32,1);position:relative;overflow:hidden}
.tool-card::before{
  content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:radial-gradient(280px circle at var(--mx,50%) var(--my,50%),rgba(92,214,255,.08),transparent 70%);
  opacity:0;transition:opacity .35s var(--ease-out);z-index:0;
}
.tool-card:hover::before{opacity:1}
.tool-card>*{position:relative;z-index:1}
.tool-row{display:flex;gap:10px;margin-bottom:14px}
.tool-row .setting-inp{flex:1}
.tool-row .setting-inp[type="file"]{padding-top:10px;padding-bottom:10px;color:var(--t2);cursor:pointer}
.tool-row select.setting-inp{flex:initial;cursor:pointer}
.tool-row select.geo-lang-sel{flex:0 0 90px;width:90px}
.tool-row select.setting-inp option{background:var(--bg)}
.tool-row .setting-inp[type="file"]::file-selector-button,.tool-row .setting-inp[type="file"]::-webkit-file-upload-button{
  margin-right:12px;padding:7px 14px;border-radius:999px;border:1px solid rgba(92,214,255,.18);
  background:rgba(92,214,255,.08);color:var(--a);font-family:'JetBrains Mono',monospace;font-size:11px;
  cursor:pointer;transition:background .2s ease,border-color .2s ease,color .2s ease;
}
.tool-row .setting-inp[type="file"]:hover::file-selector-button,.tool-row .setting-inp[type="file"]:hover::-webkit-file-upload-button{
  background:rgba(92,214,255,.14);border-color:rgba(92,214,255,.32);color:#fff;
}
.tool-result{margin-top:22px;display:none}
.tool-result.show{display:block;animation:fadeUp .3s ease}
.tool-media{display:flex;gap:14px;align-items:flex-start;margin-bottom:16px}
.tool-thumb-wrap{flex-shrink:0;width:148px;border-radius:calc(var(--r2) + 4px);overflow:hidden;border:1px solid var(--g-bd2);background:rgba(255,255,255,.02);box-shadow:0 10px 28px -8px rgba(0,0,0,.5)}
.tool-thumb{width:100%;aspect-ratio:16/9;object-fit:cover;display:block}
.tool-info{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center}
.tool-title{font-weight:600;color:#fff;margin-bottom:6px;font-size:14px;line-height:1.4}
.tool-meta{font-size:11px;color:var(--t2);font-family:'JetBrains Mono',monospace;display:flex;flex-wrap:wrap;gap:6px}
.tool-meta span{background:rgba(255,255,255,.04);border:1px solid var(--g-bd);border-radius:999px;padding:3px 9px}
.tool-btns{display:flex;gap:10px}
.tool-btns .setting-btn{margin-top:0;flex:1}
.setting-btn{display:flex;align-items:center;justify-content:center;gap:8px}
.setting-btn svg{width:15px;height:15px;flex-shrink:0;opacity:.85}
.tool-err{color:#ff8080;font-size:12px;margin-top:10px;font-family:'JetBrains Mono',monospace}
.tool-err:empty{display:none}
.tool-loading{font-size:12px;color:var(--t2);font-family:'JetBrains Mono',monospace;margin-top:12px;display:flex;align-items:center;gap:10px}
.tool-spinner{width:13px;height:13px;border-radius:50%;border:2px solid rgba(255,255,255,.12);border-top-color:var(--a);animation:toolSpin .7s linear infinite;flex-shrink:0}
@keyframes toolSpin{to{transform:rotate(360deg)}}
.geo-coords{display:inline-flex;align-items:center;gap:7px;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--a);background:rgba(92,214,255,.07);border:1px solid rgba(92,214,255,.18);border-radius:999px;padding:6px 13px}
.geo-coords svg{width:13px;height:13px;flex-shrink:0}
.geo-address{margin-top:10px;font-size:12px;color:var(--t1);line-height:1.6;display:none}
.geo-address.show{display:block;animation:fadeUp .3s ease}
.geo-exif{margin-top:14px;border-radius:var(--r2);background:rgba(255,255,255,.02);border:1px solid var(--g-bd);overflow:hidden;display:none}
.geo-exif.show{display:block;animation:fadeUp .3s ease}
.geo-exif-toggle{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 16px;background:none;border:none;cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:rgba(92,214,255,.7);transition:color .2s ease}
.geo-exif-toggle:hover{color:var(--a)}
.geo-exif-toggle svg{width:13px;height:13px;flex-shrink:0;transition:transform .3s var(--ease-out)}
.geo-exif.open .geo-exif-toggle svg{transform:rotate(180deg)}
.geo-exif-body{display:none;padding:0 16px 16px}
.geo-exif.open .geo-exif-body{display:block;animation:fadeUp .25s ease}
.geo-exif-table{width:100%;border-collapse:collapse;font-size:11px;font-family:'JetBrains Mono',monospace}
.geo-exif-table tr{border-top:1px solid var(--g-bd)}
.geo-exif-table tr:first-child{border-top:none}
.geo-exif-table td{padding:7px 0;vertical-align:top;word-break:break-all}
.geo-exif-table td:first-child{color:var(--t2);padding-right:14px;white-space:nowrap;width:1%}
.geo-exif-table td:last-child{color:var(--t1)}
.geo-map-wrap{margin-top:14px;padding:6px;border-radius:calc(var(--r2) + 6px);background:rgba(255,255,255,.02);border:1px solid var(--g-bd);display:none}
.geo-map-wrap.show{display:block;animation:fadeUp .3s ease}
.geo-map{width:100%;height:220px;border:none;border-radius:var(--r2);display:block}
.geo-ai{margin-top:14px;padding:16px;border-radius:var(--r2);background:rgba(255,255,255,.02);border:1px solid var(--g-bd)}
.geo-ai-label{font-size:10px;letter-spacing:.16em;text-transform:uppercase;font-family:'JetBrains Mono',monospace;color:rgba(92,214,255,.7);margin-bottom:10px;display:flex;align-items:center;gap:8px}
.geo-ai-label::before{content:'';width:14px;height:1px;background:rgba(92,214,255,.4)}
.geo-ai-confidence{display:inline-flex;align-items:center;gap:5px;font-size:10px;letter-spacing:.08em;text-transform:uppercase;border-radius:999px;padding:3px 10px;margin-left:auto}
.geo-ai-confidence[data-level="high"]{color:#7ee8a8;background:rgba(126,232,168,.1);border:1px solid rgba(126,232,168,.22)}
.geo-ai-confidence[data-level="medium"]{color:#f5d742;background:rgba(245,215,66,.08);border:1px solid rgba(245,215,66,.2)}
.geo-ai-confidence[data-level="low"]{color:#ff9b9b;background:rgba(255,80,80,.08);border:1px solid rgba(255,80,80,.2)}
.geo-text{font-size:12px;color:var(--t1);line-height:1.7;white-space:pre-wrap}
.geo-ai-alt{margin-top:10px;font-size:11px;color:var(--t2);font-style:italic;line-height:1.6}
.geo-ai-map-wrap{margin-top:14px;padding:6px;border-radius:calc(var(--r2) + 6px);background:rgba(255,255,255,.02);border:1px solid var(--g-bd);display:none}
.geo-ai-map-wrap.show{display:block;animation:fadeUp .3s ease}
.geo-ai-map-caption{font-size:11px;color:var(--t3);padding:8px 4px 2px;font-family:'JetBrains Mono',monospace;line-height:1.5}
.geo-ai-map-fallback{display:block;padding:12px 14px;font-size:13px;color:var(--accent);text-decoration:none;font-family:'JetBrains Mono',monospace;border-radius:8px;transition:opacity .2s}
.geo-ai-map-fallback:hover{opacity:.75}
.geo-ai.geo-ai-error{background:rgba(255,80,80,.05);border-color:rgba(255,80,80,.18)}
.geo-ai.geo-ai-error .geo-ai-label{color:#ff9b9b}
.geo-ai.geo-ai-error .geo-ai-label::before{background:rgba(255,80,80,.4)}
.geo-ai.geo-ai-error .geo-text{color:#ffb3b3}
.geo-ai-disclaimer{margin-top:12px;padding-top:12px;border-top:1px solid var(--g-bd);display:flex;gap:8px;align-items:flex-start;font-size:11px;line-height:1.6;color:var(--t3);font-family:'JetBrains Mono',monospace}
.geo-ai-disclaimer svg{width:14px;height:14px;flex-shrink:0;margin-top:1px;opacity:.6;color:#f5d742}

/* Flipper panel */
#panel-flipper{overflow:hidden}
.flip-root{display:flex;flex-direction:column;height:100%;background:transparent;position:relative;z-index:1}
.flip-hdr{display:flex;align-items:center;gap:12px;padding:14px 20px 12px;border-bottom:1px solid var(--g-bd);flex-shrink:0}
.flip-hdr-logo{display:flex;align-items:center;gap:10px}
.flip-logo-icon{color:var(--a);opacity:.85;width:22px;height:22px;flex-shrink:0}
.flip-logo-icon svg{width:100%;height:100%}
.flip-title{font-family:'Bricolage Grotesque',Arial,sans-serif;font-size:16px;font-weight:600;color:#fff;letter-spacing:-.01em}
.flip-conn{display:flex;align-items:center;gap:6px;margin-left:auto}
.flip-dot{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.15);flex-shrink:0;transition:all .3s}
.flip-dot.ok{background:var(--a);box-shadow:0 0 8px rgba(92,214,255,.6)}
.flip-dot.err{background:#ff6467}
.flip-dot.spin{background:var(--a);animation:pulse .8s ease-in-out infinite}
.flip-conn-txt{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--t3);letter-spacing:.04em}
.flip-toolbar{display:flex;align-items:center;gap:8px;padding:10px 20px;border-bottom:1px solid var(--g-bd);flex-shrink:0}
.flip-port-sel{flex:1;background:var(--g-bg);border:1px solid var(--g-bd2);border-radius:var(--r2);padding:7px 10px;color:var(--t1);font-family:'JetBrains Mono',monospace;font-size:11px;outline:none;cursor:pointer;transition:border-color .2s,background .2s}
.flip-port-sel:focus{border-color:rgba(92,214,255,.35);background:rgba(92,214,255,.05)}
.flip-port-sel option{background:var(--bg)}
.flip-btn{display:flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:var(--r2);border:1px solid var(--g-bd2);background:var(--g-bg);cursor:pointer;color:var(--t2);transition:border-color .2s ease,background .2s ease,color .2s ease,transform .15s cubic-bezier(.23,1,.32,1);flex-shrink:0;font-size:14px}
.flip-btn:hover{border-color:var(--g-bd-h);background:rgba(92,214,255,.05);color:var(--a)}
.flip-btn:active{transform:scale(.93)}
.flip-bc{display:flex;align-items:center;gap:4px;padding:8px 20px;border-bottom:1px solid var(--g-bd);flex-shrink:0;overflow-x:auto;scrollbar-width:none;min-height:34px}
.flip-bc::-webkit-scrollbar{display:none}

<body>
<div class="aurora-container" id="auroraContainer"></div>
<div class="bg-orbs"><span></span><span></span><span></span></div>
<div class="scanline"></div>
<script>
(function(){
  var ctn=document.getElementById('auroraContainer');
  var canvas=document.createElement('canvas');
  ctn.appendChild(canvas);
  var gl=canvas.getContext('webgl2',{alpha:true,premultipliedAlpha:true,antialias:true});
  if(!gl){ctn.style.display='none';return;}
  gl.clearColor(0,0,0,0);
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.ONE,gl.ONE_MINUS_SRC_ALPHA);

  var vertSrc=`#version 300 es
in vec2 position;
void main(){gl_Position=vec4(position,0.0,1.0);}`;

  var fragSrc=`#version 300 es
precision highp float;
uniform float uTime;
uniform float uAmplitude;
uniform vec3 uColorStops[3];
uniform vec2 uResolution;
uniform float uBlend;
out vec4 fragColor;
vec3 permute(vec3 x){return mod(((x*34.0)+1.0)*x,289.0);}
float snoise(vec2 v){
  const vec4 C=vec4(0.211324865405187,0.366025403784439,-0.577350269189626,0.024390243902439);
  vec2 i=floor(v+dot(v,C.yy));
  vec2 x0=v-i+dot(i,C.xx);
  vec2 i1=(x0.x>x0.y)?vec2(1.0,0.0):vec2(0.0,1.0);
  vec4 x12=x0.xyxy+C.xxzz;
  x12.xy-=i1;
  i=mod(i,289.0);
  vec3 p=permute(permute(i.y+vec3(0.0,i1.y,1.0))+i.x+vec3(0.0,i1.x,1.0));
  vec3 m=max(0.5-vec3(dot(x0,x0),dot(x12.xy,x12.xy),dot(x12.zw,x12.zw)),0.0);
  m=m*m;m=m*m;
  vec3 x=2.0*fract(p*C.www)-1.0;
  vec3 h=abs(x)-0.5;
  vec3 ox=floor(x+0.5);
  vec3 a0=x-ox;
  m*=1.79284291400159-0.85373472095314*(a0*a0+h*h);
  vec3 g;
  g.x=a0.x*x0.x+h.x*x0.y;
  g.yz=a0.yz*x12.xz+h.yz*x12.yw;
  return 130.0*dot(m,g);
}
struct ColorStop{vec3 color;float position;};
#define COLOR_RAMP(colors,factor,finalColor){int index=0;for(int i=0;i<2;i++){ColorStop currentColor=colors[i];bool isInBetween=currentColor.position<=factor;index=int(mix(float(index),float(i),float(isInBetween)));}ColorStop currentColor=colors[index];ColorStop nextColor=colors[index+1];float range=nextColor.position-currentColor.position;float lerpFactor=(factor-currentColor.position)/range;finalColor=mix(currentColor.color,nextColor.color,lerpFactor);}
void main(){
  vec2 uv=gl_FragCoord.xy/uResolution;
  ColorStop colors[3];
  colors[0]=ColorStop(uColorStops[0],0.0);
  colors[1]=ColorStop(uColorStops[1],0.5);
  colors[2]=ColorStop(uColorStops[2],1.0);
  vec3 rampColor;
  COLOR_RAMP(colors,uv.x,rampColor);
  float height=snoise(vec2(uv.x*2.0+uTime*0.1,uTime*0.25))*0.5*uAmplitude;
  height=exp(height);
  height=(uv.y*2.0-height+0.2);
  float intensity=0.6*height;
  float midPoint=0.20;
  float auroraAlpha=smoothstep(midPoint-uBlend*0.5,midPoint+uBlend*0.5,intensity);
  vec3 auroraColor=intensity*rampColor;
  fragColor=vec4(auroraColor*auroraAlpha,auroraAlpha);
}`;

  function compile(type,src){var s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);return s;}
  var vs=compile(gl.VERTEX_SHADER,vertSrc);
  var fs=compile(gl.FRAGMENT_SHADER,fragSrc);
  var prog=gl.createProgram();
  gl.attachShader(prog,vs);gl.attachShader(prog,fs);gl.linkProgram(prog);
  gl.useProgram(prog);

  var buf=gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER,buf);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1, 3,-1, -1,3]),gl.STATIC_DRAW);
  var posLoc=gl.getAttribLocation(prog,'position');
  gl.enableVertexAttribArray(posLoc);
  gl.vertexAttribPointer(posLoc,2,gl.FLOAT,false,0,0);

  var uTime=gl.getUniformLocation(prog,'uTime');
  var uAmp=gl.getUniformLocation(prog,'uAmplitude');
  var uRes=gl.getUniformLocation(prog,'uResolution');
  var uBlend=gl.getUniformLocation(prog,'uBlend');
  var uCS=[gl.getUniformLocation(prog,'uColorStops[0]'),gl.getUniformLocation(prog,'uColorStops[1]'),gl.getUniformLocation(prog,'uColorStops[2]')];

  function hexToRgb(hex){var n=parseInt(hex.slice(1),16);return [((n>>16)&255)/255,((n>>8)&255)/255,(n&255)/255];}
  var stops=['#0b2433','#5cd6ff','#2a9fe0'].map(hexToRgb);
  for(var i=0;i<3;i++){gl.uniform3f(uCS[i],stops[i][0],stops[i][1],stops[i][2]);}
  gl.uniform1f(uAmp,1.0);
  gl.uniform1f(uBlend,0.5);

  function resize(){
    var dpr=Math.min(window.devicePixelRatio||1,2);
    var w=ctn.offsetWidth,h=ctn.offsetHeight;
    canvas.width=Math.max(1,w*dpr);
    canvas.height=Math.max(1,h*dpr);
    gl.viewport(0,0,canvas.width,canvas.height);
    gl.uniform2f(uRes,canvas.width,canvas.height);
  }
  window.addEventListener('resize',resize);
  resize();

  function render(t){
    gl.uniform1f(uTime,t*0.001);
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.drawArrays(gl.TRIANGLES,0,3);
    requestAnimationFrame(render);
  }
  requestAnimationFrame(render);
})();
</script>

function setAiLang(lang){

  if(geoSel) geoSel.value = lang;
  if(sSel) sSel.value = lang;
}

  });
}
setDockLang(localStorage.getItem('kiki_lang') || 'en');
// Propagate language changes coming from the OSINT/WiFi-Cracker iframes (same-origin localStorage)
window.addEventListener('storage', function(e){

});
window.addEventListener('message', function(e){

});

// ─── Dock hide/show toggle ─────────────────────────────────
function toggleDock(){
  var dock=document.querySelector('.icon-btns');
  var btn=document.getElementById('dockToggle');
  var hidden=dock.classList.toggle('dock-hidden');
  btn.classList.toggle('dock-hidden',hidden);
  localStorage.setItem('kiki_dock_hidden',hidden?'1':'0');
}
if(localStorage.getItem('kiki_dock_hidden')==='1'){
  document.querySelector('.icon-btns').classList.add('dock-hidden');
  document.getElementById('dockToggle').classList.add('dock-hidden');
}

// ─── Panel switching with localStorage ───────────────────
var current = localStorage.getItem('kiki_panel') || 'osint';
(function init(){
  if(current !== 'osint'){
    document.getElementById('panel-osint').classList.remove('active');
    document.getElementById('panel-'+current).classList.add('active');
    document.querySelectorAll('.icon-btn').forEach(function(b){b.classList.remove('is-active')});
    var di = document.getElementById('di-'+current);
    if(di) di.classList.add('is-active');
    if(current==='settings') loadSettings();
    if(current==='flipper') flipInit();
  }
})();

function sw(name){
  if(name===current)return;
  var prev=current; current=name;
  localStorage.setItem('kiki_panel',name);
  var btn=document.getElementById('di-'+name);
  if(btn){btn.style.transform='scale(0.85)';setTimeout(function(){btn.style.transform='';},150)}
  var outEl=document.getElementById('panel-'+prev);
  if(outEl){outEl.classList.add('leaving');outEl.classList.remove('active')}
  setTimeout(function(){
    document.querySelectorAll('.icon-btn').forEach(function(b){b.classList.remove('is-active')});
    document.getElementById('di-'+name).classList.add('is-active');
    var inEl=document.getElementById('panel-'+name);
    inEl.classList.add('active');
    if(outEl)setTimeout(function(){outEl.classList.remove('leaving')},300);
    if(name==='settings') loadSettings();
    if(name==='flipper') flipInit();
  },120);
}

// ─── Settings ────────────────────────────────────────────
async function loadSettings(){
  try{var r=await fetch('/api/keys'),d=await r.json();
    var m={'s-vk':'VK_TOKEN','s-gem':'GEMINI_API_KEY','s-ant':'ANTHROPIC_API_KEY'};
    Object.keys(m).forEach(function(k){var el=document.getElementById(k);if(el&&d[m[k]])el.placeholder=d[m[k]]})
  }catch(e){}
}
async function saveSettings(){
  var data={},m={'s-vk':'VK_TOKEN','s-gem':'GEMINI_API_KEY','s-ant':'ANTHROPIC_API_KEY'};
  Object.keys(m).forEach(function(k){var el=document.getElementById(k);if(el){var v=el.value.trim();if(v)data[m[k]]=v}});
  try{
    await fetch('/api/keys',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
    Object.keys(m).forEach(function(k){var el=document.getElementById(k);if(el)el.value=''});
    sw('osint');
  }catch(e){alert('Error: '+e.message)}
}

// ─── Downloader ──────────────────────────────────────────
function dlFetchInfo(){
  var url=document.getElementById('dl-url').value.trim();
  var err=document.getElementById('dl-err'), loading=document.getElementById('dl-loading'), result=document.getElementById('dl-result');
  err.textContent=''; result.classList.remove('show');
  if(!url){err.textContent='Enter a URL';return}
  loading.style.display='flex';
  fetch('/api/dl/info',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:url})})
    .then(function(r){return r.json()}).then(function(d){
      loading.style.display='none';
      if(d.error){err.textContent=d.error;return}
      var thumb=document.getElementById('dl-thumb'), thumbWrap=document.getElementById('dl-thumb-wrap');
      if(d.thumbnail){thumb.src=d.thumbnail;thumbWrap.style.display='block'}else{thumbWrap.style.display='none'}
      document.getElementById('dl-info-title').textContent=d.title||'';
      var meta=[];
      if(d.uploader) meta.push(d.uploader);
      if(d.duration) meta.push(Math.floor(d.duration/60)+':'+String(Math.floor(d.duration%60)).padStart(2,'0'));
      if(d.extractor) meta.push(d.extractor);
      document.getElementById('dl-meta').innerHTML=meta.map(function(m){return '<span>'+m+'</span>'}).join('');
      result.dataset.url=url;
      result.classList.add('show');
    }).catch(function(e){loading.style.display='none';err.textContent=String(e)});
}

function dlDownload(mode){
  var url=document.getElementById('dl-result').dataset.url;
  var err=document.getElementById('dl-err'), loading=document.getElementById('dl-dl-loading');
  err.textContent=''; loading.style.display='flex';
  document.getElementById('dl-dl-loading-text').textContent=mode==='audio'?'Downloading & extracting audio…':'Downloading video…';
  fetch('/api/dl/download',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:url,mode:mode})})
    .then(function(r){return r.json()}).then(function(d){
      loading.style.display='none';
      if(!d.ok){err.textContent=d.error||'Download failed';return}
      var a=document.createElement('a');
      a.href='/api/dl/file?name='+encodeURIComponent(d.file);
      a.download=d.file;
      document.body.appendChild(a); a.click(); a.remove();
    }).catch(function(e){loading.style.display='none';err.textContent=String(e)});
}

// ─── GEOINT ──────────────────────────────────────────────
function geoAnalyze(){
  var fileInp=document.getElementById('geo-file');
  var err=document.getElementById('geo-err'), loading=document.getElementById('geo-loading'), result=document.getElementById('geo-result');
  var lang=localStorage.getItem('kiki_lang')||'en', t=TOOL_LABELS[lang]||TOOL_LABELS.en;
  err.textContent=''; result.classList.remove('show');
  if(!fileInp.files.length){err.textContent='Choose a photo';return}
  var fd=new FormData(); fd.append('photo',fileInp.files[0]);
  fd.append('ai_lang', localStorage.getItem('kiki_ai_lang') || 'ru');
  document.getElementById('geo-loading-text').textContent=t.geoLoading; loading.style.display='flex';
  fetch('/api/geoint/analyze',{method:'POST',body:fd})
    .then(function(r){return r.json()}).then(function(d){
      loading.style.display='none';
      if(d.error){err.textContent=d.error;return}
      var coordsText=document.getElementById('geo-coords-text'), mapWrap=document.getElementById('geo-map-wrap'), mapEl=document.getElementById('geo-map');
      var addressEl=document.getElementById('geo-address');
      var aiBox=document.getElementById('geo-ai'), aiLabelText=document.getElementById('geo-ai-label-text'), aiText=document.getElementById('geo-ai-text');
      var aiConf=document.getElementById('geo-ai-confidence'), aiAlt=document.getElementById('geo-ai-alt');
      var aiMapWrap=document.getElementById('geo-ai-map-wrap'), aiMapEl=document.getElementById('geo-ai-map'), aiMapCaption=document.getElementById('geo-ai-map-caption');
      var aiDisclaimer=document.getElementById('geo-ai-disclaimer');
      var exifBox=document.getElementById('geo-exif'), exifTable=document.getElementById('geo-exif-table');
      mapWrap.classList.remove('show'); mapEl.src=''; aiBox.style.display='none'; aiBox.classList.remove('geo-ai-error'); aiText.textContent=''; aiDisclaimer.style.display='none';
      aiConf.style.display='none'; aiConf.removeAttribute('data-level');
      aiAlt.style.display='none'; aiAlt.textContent='';
      aiMapWrap.classList.remove('show'); aiMapEl.src=''; aiMapCaption.textContent='';
      addressEl.classList.remove('show'); addressEl.textContent='';
      exifBox.classList.remove('show','open'); exifTable.innerHTML='';
      if(d.lat!=null && d.lon!=null){
        coordsText.textContent=t.geoCoords+': '+d.lat.toFixed(6)+', '+d.lon.toFixed(6);
        var delta=0.01;
        mapEl.src='https://www.openstreetmap.org/export/embed.html?bbox='+(d.lon-delta)+','+(d.lat-delta)+','+(d.lon+delta)+','+(d.lat+delta)+'&marker='+d.lat+','+d.lon;
        mapWrap.classList.add('show');
        if(d.address){
          addressEl.textContent=d.address;
          addressEl.classList.add('show');
        }
      }else{
        coordsText.textContent=t.geoNoGps;
      }
      if(d.ai_guess){
        var g=d.ai_guess;
        aiLabelText.textContent=t.geoAiTitle; aiBox.style.display='block'; aiDisclaimer.style.display='flex';
        var confKey={high:'geoConfHigh',medium:'geoConfMedium',low:'geoConfLow'}[g.confidence];
        if(confKey){
          aiConf.textContent=t[confKey]; aiConf.dataset.level=g.confidence; aiConf.style.display='inline-flex';
        }
        var parts=[];
        if(g.location) parts.push(g.location);
        if(g.reasoning) parts.push(g.reasoning);
        aiText.textContent=parts.join('\n\n');
        if(g.alternatives){
          aiAlt.textContent=g.alternatives; aiAlt.style.display='block';
        }
        if(d.ai_location && d.ai_location.lat!=null && d.ai_location.lon!=null){
          var aLat=d.ai_location.lat, aLon=d.ai_location.lon, aDelta=0.05;
          aiMapEl.src='https://www.openstreetmap.org/export/embed.html?bbox='+(aLon-aDelta)+','+(aLat-aDelta)+','+(aLon+aDelta)+','+(aLat+aDelta)+'&marker='+aLat+','+aLon;
          aiMapCaption.textContent=t.geoAiMapCaption+': '+(d.ai_location.display_name||(aLat.toFixed(4)+', '+aLon.toFixed(4)));
          aiMapWrap.classList.add('show');
        } else if(g.location){
          var fallbackLink=document.createElement('a');
          fallbackLink.href='https://www.google.com/maps/search/'+encodeURIComponent(g.location);
          fallbackLink.target='_blank'; fallbackLink.rel='noopener noreferrer';
          fallbackLink.className='geo-ai-map-fallback';
          fallbackLink.textContent=t.geoAiMapFallback+': '+g.location;
          aiMapWrap.innerHTML=''; aiMapWrap.appendChild(fallbackLink);
          aiMapWrap.classList.add('show');
        }
      }else if(d.ai_error){
        aiLabelText.textContent=t.geoAiError; aiText.textContent=d.ai_error; aiBox.classList.add('geo-ai-error'); aiBox.style.display='block';
      }
      if(d.exif_data && Object.keys(d.exif_data).length){
        var keys=Object.keys(d.exif_data).sort();
        for(var i=0;i<keys.length;i++){
          var tr=document.createElement('tr');
          var tdK=document.createElement('td'), tdV=document.createElement('td');
          tdK.textContent=keys[i]; tdV.textContent=d.exif_data[keys[i]];
          tr.appendChild(tdK); tr.appendChild(tdV);
          exifTable.appendChild(tr);
        }
        exifBox.classList.add('show');
      }
      result.classList.add('show');
    }).catch(function(e){loading.style.display='none';err.textContent=String(e)});
}

// ─── Flipper Zero ────────────────────────────────────────
var flipCurPath = localStorage.getItem('kiki_flip_path') || '/ext';
var flipCurPort = localStorage.getItem('kiki_flip_port') || '';
var flipInited  = false;

function flipSetStatus(state, txt){
  var dot=document.getElementById('flip-dot');
  var ctxt=document.getElementById('flip-conn-txt');
  if(dot){dot.className='flip-dot '+(state||'')}
  if(ctxt) ctxt.textContent=txt||state||'';
}

function flipInit(){
  if(flipInited) return;
  flipInited=true;
  flipLoadPorts();
}

async function flipLoadPorts(){
  try{
    var r=await fetch('/api/flipper/ports'),d=await r.json();
    var sel=document.getElementById('flip-port-sel');
    if(!sel) return;
    sel.innerHTML='<option value="">— select COM port —</option>';
    if(d.ports&&d.ports.length){
      d.ports.forEach(function(p){
        var opt=document.createElement('option');
        opt.value=p.port;
        opt.textContent=p.port+(p.desc&&p.desc!==p.port?' — '+p.desc:'')+(p.likely?' [flipper]':'');
        if(p.port===flipCurPort) opt.selected=true;
        sel.appendChild(opt);
      });
    }
    if(!d.ok && d.error){
      flipSetStatus('err','pyserial missing');
      flipShowBody('<div class="flip-warn">'+d.error+'<br>Run: pip install pyserial</div>');
      return;
    }
    if(flipCurPort) flipPortChange();
  }catch(e){flipSetStatus('err','fetch failed')}
}

function flipPortChange(){
  var sel=document.getElementById('flip-port-sel');
  if(!sel) return;
  flipCurPort=sel.value;
  if(flipCurPort) localStorage.setItem('kiki_flip_port',flipCurPort);
  if(flipCurPort) flipBrowse(flipCurPath);
  else flipSetStatus('','disconnected');
}

function flipRefresh(){
  if(flipCurPort) flipBrowse(flipCurPath);
}

async function flipBrowse(path){
  if(!flipCurPort) return;
  flipCurPath=path;
  localStorage.setItem('kiki_flip_path',path);
  flipSetStatus('spin','browsing...');
  flipRenderBreadcrumb(path);
    flipShowBody('<div class="flip-empty"><div class="flip-empty-icon"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" style="color:var(--a);animation:pulse .8s ease-in-out infinite"><rect x="4" y="2" width="16" height="20" rx="2.5"/><line x1="8" y1="7" x2="16" y2="7"/><line x1="8" y1="10" x2="13" y2="10"/></svg></div><div class="flip-empty-txt">loading...</div></div>');
  try{
    var r=await fetch('/api/flipper/list?port='+encodeURIComponent(flipCurPort)+'&path='+encodeURIComponent(path));
    var d=await r.json();
    if(!d.ok){
      flipSetStatus('err','error');
      flipShowBody('<div class="flip-err">'+d.error+'</div>');
      return;
    }
    flipSetStatus('ok','connected');
    flipRenderFiles(d.files, path);
  }catch(e){
    flipSetStatus('err','failed');
    flipShowBody('<div class="flip-err">'+e.message+'</div>');
  }
}

function flipRenderBreadcrumb(path){
  var bc=document.getElementById('flip-bc');
  if(!bc) return;
  var parts=path.split('/').filter(Boolean);
  var html='<span class="flip-bc-seg '+(parts.length===0?'last':'')+'" onclick="flipBrowse(\'/ext\')">/ext</span>';
  // Only show sub-segments after 'ext'
  var extIdx=parts.indexOf('ext');
  var sub=extIdx>=0?parts.slice(extIdx+1):[];
  sub.forEach(function(seg,i){
    var pathTo='/ext/'+sub.slice(0,i+1).join('/');
    html+='<span class="flip-bc-sep">›</span>';
    html+='<span class="flip-bc-seg '+(i===sub.length-1?'last':'')+'" onclick="flipBrowse(\''+pathTo+'\')">'+seg+'</span>';
  });
  bc.innerHTML=html;
}

function flipRenderFiles(files, curPath){
  if(!files||files.length===0){
    flipShowBody('<div class="flip-empty"><div class="flip-empty-icon"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" style="opacity:.5"><rect x="4" y="2" width="16" height="20" rx="2.5"/></svg></div><div class="flip-empty-txt">empty folder</div></div>');
    return;
  }
  var html='<div class="flip-grid">';
  files.forEach(function(f){
    var ext=f.name.split('.').pop().toLowerCase();
    var extBadge='';
    if(!f.is_dir){
      var cls=ext==='pcap'||ext==='pcapng'||ext==='cap'?'flip-ext-pcap':'flip-ext-txt';
      extBadge='<span class="flip-ext '+cls+'">'+ext+'</span>';
    }
var ICON_DIR='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="opacity:.7"><path d="M3 7a2 2 0 0 1 2-2h3.586a1 1 0 0 1 .707.293L10.707 6.7A1 1 0 0 0 11.414 7H19a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" fill="currentColor" opacity=".12" stroke="currentColor"/></svg>';
    var ICON_PCAP='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="color:var(--a);opacity:.8"><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z" fill="currentColor" opacity=".12"/><polyline points="13 2 13 9 20 9"/><path d="M8 14.5l2-2 2 2 2-3" stroke-width="1.5"/></svg>';
    var ICON_FILE='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="opacity:.55"><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z" fill="currentColor" opacity=".1"/><polyline points="13 2 13 9 20 9"/></svg>';
    var icon=f.is_dir?ICON_DIR:(ext==='pcap'||ext==='pcapng'||ext==='cap'?ICON_PCAP:ICON_FILE);
    var size='';
    if(!f.is_dir){
      if(f.size>1048576) size=(f.size/1048576).toFixed(1)+' MB';
      else if(f.size>1024) size=Math.round(f.size/1024)+' KB';
      else size=f.size+' B';
    }
    var fullPath=curPath.replace(/\/+$/,'')+'/'+f.name;
    if(f.is_dir){
      html+='<div class="flip-item is-dir" onclick="flipBrowse(\''+fullPath+'\')">'+
        '<span class="flip-item-icon">'+icon+'</span>'+
        '<div class="flip-item-info"><div class="flip-item-name">'+f.name+'</div></div>'+
        '<span style="color:var(--t3);font-size:12px;opacity:.5">›</span>'+
      '</div>';
    }else{
      var isCap=(ext==='pcap'||ext==='pcapng'||ext==='cap');
      var btns='<a class="flip-dl-btn" onclick="flipDownloadFile(\''+fullPath+'\',\''+f.name+'\',\''+ext+'\')" title="Download">↓</a>';
      if(isCap) btns+='<button class="flip-wc-btn" onclick="flipSendToWC(\''+fullPath+'\',\''+f.name+'\')" title="Send to WiFi Cracker"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 9.9-1"/></svg></button>';
      html+='<div class="flip-item is-file">'+
        '<span class="flip-item-icon">'+icon+'</span>'+
        '<div class="flip-item-info">'+
          '<div class="flip-item-name"><span>'+f.name+'</span>'+extBadge+'</div>'+
          '<div class="flip-item-size">'+size+'</div>'+
        '</div>'+
        btns+
      '</div>';
    }
  });
  html+='</div>';
  flipShowBody(html);
}

function flipShowBody(html){
  var body=document.getElementById('flip-body');
  if(body) body.innerHTML=html;
}

// ─── Download overlay ─────────────────────────────────────
var OV_STEPS = [
  {id:'s1', label:'connecting to flipper'},
  {id:'s2', label:'downloading file'},
  {id:'s3', label:'saving to disk'}
];
var SPIN_SVG='<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 2a10 10 0 0 1 10 10"/></svg>';
var CHECK_SVG='<svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
var X_SVG='<svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>';

function flipShowOverlay(filename, isCapture, filesize){
  var ov=document.getElementById('flip-overlay');
  var stepsEl=document.getElementById('ov-steps');
  document.getElementById('ov-file').textContent=filename;
  var sz=document.getElementById('ov-size');
  if(sz) sz.textContent=filesize?formatSize(filesize):'';
  var bar=document.getElementById('ov-bar');
  bar.style.width='0%'; bar.classList.add('anim');
  document.getElementById('ov-err').style.display='none';
  document.getElementById('ov-close').style.display='none';
  var html='';
  var steps=isCapture?WC_OV_STEPS:OV_STEPS;
  steps.forEach(function(s){
    html+='<div class="flip-ov-step" id="'+s.id+'">'+
      '<div class="flip-ov-step-dot wait"><div style="width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.2)"></div></div>'+
      '<div class="flip-ov-step-lbl">'+s.label+'</div></div>';
  });
  stepsEl.innerHTML=html;
  ov.style.display='flex';
}

function formatSize(b){
  if(b>1048576) return (b/1048576).toFixed(1)+' MB';
  if(b>1024) return Math.round(b/1024)+' KB';
  return b+' B';
}

function flipSetStep(stepId, state){
  var el=document.getElementById(stepId);
  if(!el) return;
  el.className='flip-ov-step is-'+state;
  var dot=el.querySelector('.flip-ov-step-dot');
  dot.className='flip-ov-step-dot '+state;
  if(state==='run') dot.innerHTML=SPIN_SVG;
  else if(state==='done') dot.innerHTML=CHECK_SVG;
      else if(state==='warn') dot.innerHTML='<svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="9" x2="12" y2="13"/><circle cx="12" cy="17" r="1" fill="currentColor"/></svg>';
  else dot.innerHTML='<div style="width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.2)"></div>';
}

function flipSetBar(pct){
  var b=document.getElementById('ov-bar');
  b.style.width=pct+'%';
  if(pct>=100) b.classList.remove('anim');
}
function flipHideOverlay(){ document.getElementById('flip-overlay').style.display='none'; }
function flipShowOvErr(msg){
  var e=document.getElementById('ov-err');
  e.style.display='block'; e.textContent=msg;
  document.getElementById('ov-close').style.display='block';
}

async function flipDownloadFile(path, filename, ext){
  var isCapture=['pcap','pcapng','cap'].includes(ext.toLowerCase());

  // For captures: use 4-step overlay (connect, download, save, check eapol)
  // For others: standard 3-step overlay
  var steps = isCapture
    ? [{id:'s1',label:'connecting to flipper'},{id:'s2',label:'downloading file'},{id:'s3',label:'saving to disk'},{id:'s4',label:'checking eapol frames'}]
    : OV_STEPS;

  // Render overlay manually so we can use custom steps for capture
  var ov=document.getElementById('flip-overlay');
  var stepsEl=document.getElementById('ov-steps');
  document.getElementById('ov-file').textContent=filename;
  document.getElementById('ov-size').textContent='';
  document.getElementById('ov-bar').style.width='0%';
  document.getElementById('ov-bar').classList.add('anim');
  document.getElementById('ov-err').style.display='none';
  document.getElementById('ov-close').style.display='none';
  var html='';
  steps.forEach(function(s){
    html+='<div class="flip-ov-step" id="'+s.id+'">'+
      '<div class="flip-ov-step-dot wait"><div style="width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.2)"></div></div>'+
      '<div class="flip-ov-step-lbl">'+s.label+'</div></div>';
  });
  stepsEl.innerHTML=html;
  ov.style.display='flex';

  try{
    flipSetStep('s1','run'); flipSetBar(10);
    await new Promise(function(r){setTimeout(r,200)});
    flipSetStep('s1','done'); flipSetStep('s2','run'); flipSetBar(25);

    // Save to disk
    var r=await fetch('/api/flipper/save?port='+encodeURIComponent(flipCurPort)+'&path='+encodeURIComponent(path));
    var d=await r.json();
    if(!d.ok){ flipSetStep('s2','err'); flipShowOvErr(d.error||'download failed'); return; }

    flipSetStep('s2','done'); flipSetStep('s3','run'); flipSetBar(60);
    await new Promise(function(r){setTimeout(r,200)});
    flipSetStep('s3','done'); flipSetBar(75);

    if(isCapture){
      // Step 4: check EAPOL
      flipSetStep('s4','run'); flipSetBar(85);
      var r2=await fetch('/api/hc/analyze',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pcap:d.local_path})});
      var a=await r2.json();
      var eapol=a.eapol||0;
      var s4=document.getElementById('s4');
      if(s4){
        var lbl=s4.querySelector('.flip-ov-step-lbl');
        lbl.textContent=eapol+' EAPOL frame'+(eapol!==1?'s':'')+(eapol>=2?' — ready to crack':eapol===0?' — no handshake':' — weak capture');
      }
      flipSetStep('s4', eapol>=2 ? 'done' : 'warn');
      flipSetBar(100);
      // Trigger browser download
      window.location.href='/api/flipper/file?name='+encodeURIComponent(d.filename);
      document.getElementById('ov-close').style.display='block';
    } else {
      // Trigger browser download from already-saved file
      flipSetBar(100);
      await new Promise(function(r){setTimeout(r,200)});
      window.location.href='/api/flipper/file?name='+encodeURIComponent(d.filename);
      await new Promise(function(r){setTimeout(r,400)});
      flipHideOverlay();
    }
  } catch(e){
    flipSetStep('s2','err');
    flipShowOvErr(e.message);
  }
}
// ─── Send to WiFi Cracker with validation ─────────────────
var WC_OV_STEPS = [
  {id:'w1', label:'saving to disk'},
  {id:'w2', label:'checking eapol frames'}
];

async function flipSendToWC(path, filename){
  // Show 3-step overlay
  var ov=document.getElementById('flip-overlay');
  var stepsEl=document.getElementById('ov-steps');
  document.getElementById('ov-file').textContent=filename;
  document.getElementById('ov-bar').style.width='0%';
  document.getElementById('ov-err').style.display='none';
  document.getElementById('ov-close').style.display='none';
  var html='';
  WC_OV_STEPS.forEach(function(s){
    html+='<div class="flip-ov-step" id="'+s.id+'">'+
      '<div class="flip-ov-step-dot wait"><div style="width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.2)"></div></div>'+
      '<div class="flip-ov-step-lbl">'+s.label+'</div></div>';
  });
  stepsEl.innerHTML=html;
  ov.style.display='flex';

  try{
    // Step 1: save
    flipSetStep('w1','run'); flipSetBar(15);
    var r=await fetch('/api/flipper/save?port='+encodeURIComponent(flipCurPort)+'&path='+encodeURIComponent(path));
    var d=await r.json();
    if(!d.ok){ flipSetStep('w1','err'); flipShowOvErr(d.error||'download failed'); return; }
    flipSetStep('w1','done'); flipSetBar(40);

    // Step 2: validate — quick analyze to count EAPOL
    flipSetStep('w2','run'); flipSetBar(60);
    var r2=await fetch('/api/hc/analyze',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pcap:d.local_path})});
    var a=await r2.json();
    var eapol=a.eapol||0;
    var valid=eapol>=2;

    // Update step label with result
    var w2=document.getElementById('w2');
    if(w2){
      var lbl=w2.querySelector('.flip-ov-step-lbl');
      if(valid) lbl.textContent=eapol+' EAPOL — valid for cracking';
      else      lbl.textContent=eapol+' EAPOL — no handshakes captured';
    }
    // Step 2 done
    flipSetStep('w2', valid?'done':'err'); flipSetBar(100);
    if(!valid){
      document.getElementById('ov-close').style.display='block';
      var errEl=document.getElementById('ov-err');
      errEl.style.display='block';
      errEl.textContent='Need at least 2 EAPOL frames. Try capturing with deauth.';
      return;
    }
    var w2=document.getElementById('w2');
    if(w2) w2.querySelector('.flip-ov-step-lbl').textContent=eapol+' EAPOL — ready to crack';
    document.getElementById('ov-close').style.display='block';

  }catch(e){
    flipSetStep('w1','err');
    flipShowOvErr(e.message);
  }
}
