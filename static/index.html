<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OSINT Portrait</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    background: #0a0a0f;
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif;
    color: #e8e8f0;
    overflow-x: hidden;
  }

  /* Animated background blobs */
  .bg {
    position: fixed; inset: 0; z-index: 0; overflow: hidden;
  }
  .blob {
    position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.25; animation: float 12s ease-in-out infinite;
  }
  .blob-1 { width: 600px; height: 600px; background: #6c63ff; top: -150px; left: -100px; animation-delay: 0s; }
  .blob-2 { width: 500px; height: 500px; background: #00d4ff; top: 40%; right: -100px; animation-delay: 3s; }
  .blob-3 { width: 400px; height: 400px; background: #ff6b9d; bottom: -100px; left: 30%; animation-delay: 6s; }

  @keyframes float {
    0%, 100% { transform: translate(0, 0) scale(1); }
    33% { transform: translate(30px, -30px) scale(1.05); }
    66% { transform: translate(-20px, 20px) scale(0.95); }
  }

  .container {
    position: relative; z-index: 1;
    max-width: 900px; margin: 0 auto; padding: 40px 20px;
  }

  /* Glass card */
  .glass {
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(24px) saturate(180%);
    -webkit-backdrop-filter: blur(24px) saturate(180%);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 24px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.1);
  }

  header {
    text-align: center; margin-bottom: 40px; padding: 40px;
  }
  header h1 {
    font-size: 48px; font-weight: 700; letter-spacing: -1px;
    background: linear-gradient(135deg, #fff 0%, #a8b4ff 50%, #00d4ff 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  header p { color: rgba(255,255,255,0.4); font-size: 15px; margin-top: 8px; letter-spacing: 3px; text-transform: uppercase; }

  .search-card { padding: 32px; margin-bottom: 24px; }

  .input-group { margin-bottom: 20px; }
  label { display: block; font-size: 12px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: rgba(255,255,255,0.4); margin-bottom: 8px; }

  input[type="text"], input[type="password"], select {
    width: 100%;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 14px;
    padding: 14px 18px;
    color: #fff;
    font-size: 15px;
    outline: none;
    transition: all 0.3s;
  }
  input:focus, select:focus {
    border-color: rgba(108,99,255,0.6);
    background: rgba(108,99,255,0.08);
    box-shadow: 0 0 0 3px rgba(108,99,255,0.15);
  }
  select option { background: #1a1a2e; }

  .query-row { display: flex; gap: 12px; }
  .query-row input { flex: 1; }
  .query-row select { width: 160px; flex-shrink: 0; }

  /* Source toggles */
  .sources { display: flex; gap: 10px; flex-wrap: wrap; }
  .source-btn {
    padding: 10px 20px; border-radius: 50px; font-size: 13px; font-weight: 600; cursor: pointer;
    border: 1px solid rgba(255,255,255,0.15); background: rgba(255,255,255,0.05);
    color: rgba(255,255,255,0.5); transition: all 0.2s; user-select: none;
  }
  .source-btn.active {
    background: rgba(108,99,255,0.25); border-color: rgba(108,99,255,0.6);
    color: #fff; box-shadow: 0 0 20px rgba(108,99,255,0.3);
  }
  .source-btn:hover { border-color: rgba(255,255,255,0.3); color: rgba(255,255,255,0.8); }

  /* Collapsible settings */
  .settings-toggle {
    display: flex; align-items: center; gap: 8px; cursor: pointer;
    font-size: 13px; color: rgba(255,255,255,0.35); margin: 16px 0 0;
    user-select: none; transition: color 0.2s;
  }
  .settings-toggle:hover { color: rgba(255,255,255,0.6); }
  .settings-toggle .arrow { transition: transform 0.3s; font-size: 10px; }
  .settings-toggle.open .arrow { transform: rotate(90deg); }

  .settings-content {
    display: none; margin-top: 16px;
    padding: 20px; border-radius: 16px;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.06);
  }
  .settings-content.open { display: block; }
  .settings-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

  /* Search button */
  .btn-search {
    width: 100%; padding: 16px; margin-top: 24px;
    border: none; border-radius: 16px; cursor: pointer;
    font-size: 16px; font-weight: 700; letter-spacing: 0.5px;
    background: linear-gradient(135deg, #6c63ff, #00d4ff);
    color: #fff;
    box-shadow: 0 4px 24px rgba(108,99,255,0.4);
    transition: all 0.3s; position: relative; overflow: hidden;
  }
  .btn-search:hover { transform: translateY(-2px); box-shadow: 0 8px 32px rgba(108,99,255,0.5); }
  .btn-search:active { transform: translateY(0); }
  .btn-search:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
  .btn-search .spinner {
    display: none; width: 20px; height: 20px;
    border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff;
    border-radius: 50%; animation: spin 0.8s linear infinite;
    margin: 0 auto;
  }
  .btn-search.loading .spinner { display: block; }
  .btn-search.loading .btn-text { display: none; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Results */
  #results { margin-top: 0; }
  .result-card { padding: 28px; margin-bottom: 20px; animation: slideUp 0.4s ease; }
  @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

  .source-badge {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 12px; border-radius: 50px; font-size: 11px; font-weight: 700;
    letter-spacing: 1px; text-transform: uppercase; margin-bottom: 16px;
  }
  .badge-vk { background: rgba(74,118,255,0.2); color: #4a76ff; border: 1px solid rgba(74,118,255,0.3); }
  .badge-telegram { background: rgba(0,136,204,0.2); color: #0088cc; border: 1px solid rgba(0,136,204,0.3); }
  .badge-maigret { background: rgba(255,107,157,0.2); color: #ff6b9d; border: 1px solid rgba(255,107,157,0.3); }

  .profile-header { display: flex; align-items: center; gap: 16px; margin-bottom: 20px; }
  .avatar {
    width: 56px; height: 56px; border-radius: 50%;
    background: linear-gradient(135deg, #6c63ff, #00d4ff);
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; font-weight: 700; flex-shrink: 0;
  }
  .profile-name { font-size: 22px; font-weight: 700; }
  .profile-url { font-size: 13px; color: rgba(108,99,255,0.8); margin-top: 2px; }
  .profile-url a { color: inherit; text-decoration: none; }
  .profile-url a:hover { text-decoration: underline; }

  .info-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .info-item { padding: 12px 16px; border-radius: 12px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.06); }
  .info-item .key { font-size: 11px; color: rgba(255,255,255,0.3); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
  .info-item .val { font-size: 14px; color: #e8e8f0; }

  .section-title { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; color: rgba(255,255,255,0.3); margin: 20px 0 10px; }

  .post-item {
    padding: 12px 16px; border-radius: 12px; margin-bottom: 8px;
    background: rgba(255,255,255,0.03); border-left: 3px solid rgba(108,99,255,0.4);
    font-size: 14px; line-height: 1.6; color: rgba(255,255,255,0.7);
  }
  .post-item .chat-name { font-size: 11px; color: rgba(255,255,255,0.3); margin-bottom: 4px; }

  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag {
    padding: 5px 12px; border-radius: 50px; font-size: 12px;
    background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1);
    color: rgba(255,255,255,0.6);
  }

  .found-sites { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 8px; }
  .site-item {
    padding: 10px 14px; border-radius: 10px;
    background: rgba(255,107,157,0.08); border: 1px solid rgba(255,107,157,0.2);
    font-size: 13px;
  }
  .site-item a { color: #ff6b9d; text-decoration: none; }
  .site-item a:hover { text-decoration: underline; }

  .error-card { padding: 20px 28px; border-left: 3px solid #ff5f5f; }
  .error-card .error-text { color: #ff5f5f; font-size: 14px; }

  .empty { text-align: center; padding: 60px 20px; color: rgba(255,255,255,0.2); font-size: 15px; }

  @media (max-width: 600px) {
    header h1 { font-size: 32px; }
    .query-row { flex-direction: column; }
    .query-row select { width: 100%; }
    .settings-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="bg">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>
</div>

<div class="container">
  <header class="glass">
    <h1>⬡ OSINT Portrait</h1>
    <p>Цифровой след · Анализ личности</p>
  </header>

  <div class="search-card glass">
    <div class="input-group">
      <label>Запрос</label>
      <div class="query-row">
        <input type="text" id="query" placeholder="username, email или номер телефона..." />
        <select id="queryType">
          <option value="username">Username</option>
          <option value="email">Email</option>
          <option value="phone">Телефон</option>
        </select>
      </div>
    </div>

    <div class="input-group">
      <label>Источники</label>
      <div class="sources">
        <div class="source-btn active" data-source="vk">ВКонтакте</div>
        <div class="source-btn active" data-source="telegram">Telegram</div>
        <div class="source-btn active" data-source="maigret">Maigret</div>
      </div>
    </div>

    <div class="settings-toggle" id="settingsToggle">
      <span class="arrow">▶</span>
      <span>Настройки API и AI</span>
    </div>
    <div class="settings-content" id="settingsContent">
      <div class="settings-grid">
        <div class="input-group">
          <label>VK Token</label>
          <input type="password" id="vkToken" placeholder="vk1.a...." />
        </div>
        <div class="input-group">
          <label>TG API ID</label>
          <input type="text" id="tgApiId" placeholder="12345678" />
        </div>
        <div class="input-group">
          <label>TG API Hash</label>
          <input type="password" id="tgApiHash" placeholder="abc123..." />
        </div>
        <div class="input-group">
          <label>AI Провайдер</label>
          <select id="aiProvider">
            <option value="">Без AI</option>
            <option value="anthropic">Anthropic Claude</option>
            <option value="openai">OpenAI GPT</option>
            <option value="gemini">Google Gemini</option>
          </select>
        </div>
        <div class="input-group" style="grid-column: 1/-1">
          <label>AI API Ключ</label>
          <input type="password" id="aiKey" placeholder="sk-ant-..." />
        </div>
      </div>
    </div>

    <button class="btn-search" id="searchBtn" onclick="doSearch()">
      <div class="spinner"></div>
      <span class="btn-text">🔍 Найти</span>
    </button>
  </div>

  <div id="results"></div>
</div>

<script>
const API_BASE = "http://localhost:8000";

// Source toggles
document.querySelectorAll(".source-btn").forEach(btn => {
  btn.addEventListener("click", () => btn.classList.toggle("active"));
});

// Settings toggle
document.getElementById("settingsToggle").addEventListener("click", function() {
  this.classList.toggle("open");
  document.getElementById("settingsContent").classList.toggle("open");
});

async function doSearch() {
  const query = document.getElementById("query").value.trim();
  if (!query) return;

  const sources = [...document.querySelectorAll(".source-btn.active")].map(b => b.dataset.source);
  if (!sources.length) { alert("Выбери хотя бы один источник"); return; }

  const btn = document.getElementById("searchBtn");
  btn.disabled = true; btn.classList.add("loading");
  document.getElementById("results").innerHTML = "";

  try {
    const res = await fetch(`${API_BASE}/api/search`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        query,
        query_type: document.getElementById("queryType").value,
        sources,
        vk_token: document.getElementById("vkToken").value || null,
        tg_api_id: parseInt(document.getElementById("tgApiId").value) || null,
        tg_api_hash: document.getElementById("tgApiHash").value || null,
        ai_provider: document.getElementById("aiProvider").value || null,
        ai_key: document.getElementById("aiKey").value || null,
      })
    });

    const data = await res.json();
    renderResults(data.results);
  } catch(e) {
    document.getElementById("results").innerHTML = `<div class="result-card glass error-card"><div class="error-text">Ошибка подключения к серверу: ${e.message}</div></div>`;
  } finally {
    btn.disabled = false; btn.classList.remove("loading");
  }
}

function renderResults(results) {
  const container = document.getElementById("results");
  if (!results || !results.length) {
    container.innerHTML = '<div class="empty">Ничего не найдено</div>';
    return;
  }

  results.forEach(r => {
    if (r.error) {
      container.innerHTML += `<div class="result-card glass error-card"><div class="error-text">❌ ${r.error}</div></div>`;
      return;
    }

    if (r.source === "vk") renderVK(container, r);
    else if (r.source === "telegram") renderTG(container, r);
    else if (r.source === "maigret") renderMaigret(container, r);
  });
}

function initials(name) {
  return (name||"?").split(" ").map(w=>w[0]||"").join("").toUpperCase().slice(0,2);
}

function renderVK(container, r) {
  const infoItems = [
    r.city && `<div class="info-item"><div class="key">Город</div><div class="val">${r.city}</div></div>`,
    r.country && `<div class="info-item"><div class="key">Страна</div><div class="val">${r.country}</div></div>`,
    r.bdate && `<div class="info-item"><div class="key">День рождения</div><div class="val">${r.bdate}</div></div>`,
    r.followers && `<div class="info-item"><div class="key">Подписчики</div><div class="val">${r.followers.toLocaleString()}</div></div>`,
    r.occupation && `<div class="info-item"><div class="key">Работа/Учёба</div><div class="val">${r.occupation}</div></div>`,
  ].filter(Boolean).join("");

  const textFields = [
    r.about && `<div class="info-item" style="grid-column:1/-1"><div class="key">О себе</div><div class="val">${r.about}</div></div>`,
    r.interests && `<div class="info-item" style="grid-column:1/-1"><div class="key">Интересы</div><div class="val">${r.interests}</div></div>`,
    r.music && `<div class="info-item"><div class="key">Музыка</div><div class="val">${r.music}</div></div>`,
    r.movies && `<div class="info-item"><div class="key">Фильмы</div><div class="val">${r.movies}</div></div>`,
    r.books && `<div class="info-item"><div class="key">Книги</div><div class="val">${r.books}</div></div>`,
  ].filter(Boolean).join("");

  const posts = r.posts?.length ? `
    <div class="section-title">Последние посты (${r.posts.length})</div>
    ${r.posts.slice(0,5).map(p => `<div class="post-item">${p}</div>`).join("")}
  ` : "";

  const groups = r.groups?.length ? `
    <div class="section-title">Группы</div>
    <div class="tags">${r.groups.map(g => `<span class="tag">${g}</span>`).join("")}</div>
  ` : "";

  container.innerHTML += `
    <div class="result-card glass">
      <span class="source-badge badge-vk">ВКонтакте</span>
      <div class="profile-header">
        <div class="avatar">${initials(r.name)}</div>
        <div>
          <div class="profile-name">${r.name}</div>
          <div class="profile-url"><a href="${r.profile_url}" target="_blank">${r.profile_url}</a></div>
        </div>
      </div>
      ${r.status ? `<div class="post-item" style="margin-bottom:16px">"${r.status}"</div>` : ""}
      <div class="info-grid">${infoItems}${textFields}</div>
      ${posts}${groups}
    </div>`;
}

function renderTG(container, r) {
  const messages = r.messages?.length ? `
    <div class="section-title">Сообщения в публичных чатах (${r.messages.length})</div>
    ${r.messages.map(m => `<div class="post-item"><div class="chat-name">${m.chat}</div>${m.text}</div>`).join("")}
  ` : "";

  container.innerHTML += `
    <div class="result-card glass">
      <span class="source-badge badge-telegram">Telegram</span>
      <div class="profile-header">
        <div class="avatar">${initials(r.name)}</div>
        <div>
          <div class="profile-name">${r.name}</div>
          <div class="profile-url"><a href="${r.profile_url}" target="_blank">${r.profile_url}</a></div>
        </div>
      </div>
      <div class="info-grid">
        ${r.username ? `<div class="info-item"><div class="key">Username</div><div class="val">@${r.username}</div></div>` : ""}
        ${r.phone ? `<div class="info-item"><div class="key">Телефон</div><div class="val">${r.phone}</div></div>` : ""}
        ${r.bio ? `<div class="info-item" style="grid-column:1/-1"><div class="key">Bio</div><div class="val">${r.bio}</div></div>` : ""}
      </div>
      ${messages}
    </div>`;
}

function renderMaigret(container, r) {
  const sites = r.found?.length ? `
    <div class="section-title">Найдено на ${r.found.length} сайтах</div>
    <div class="found-sites">
      ${r.found.map(s => `<div class="site-item"><a href="${s.url}" target="_blank">🔗 ${s.site}</a></div>`).join("")}
    </div>
  ` : `<div class="empty" style="padding:20px">Аккаунты не найдены</div>`;

  container.innerHTML += `
    <div class="result-card glass">
      <span class="source-badge badge-maigret">Maigret</span>
      <div class="profile-header">
        <div class="avatar">🔎</div>
        <div><div class="profile-name">${r.username}</div><div class="profile-url">Поиск по 3000+ сайтам</div></div>
      </div>
      ${sites}
    </div>`;
}

// Enter key
document.getElementById("query").addEventListener("keydown", e => { if(e.key === "Enter") doSearch(); });
</script>
</body>
</html>
